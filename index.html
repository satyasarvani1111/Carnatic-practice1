<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎵 Carnatic Sarali Practice</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header class="header">

        <h1>🎵 Carnatic Sarali Practice</h1>

        <p class="subtitle">
            Learn • Listen • Practice
        </p>

    </header>

    <div class="topPanel">

        <div class="control">

            <label>🎼 Sarali</label>

            <select id="saraliSelect">

                <option value="sarali1">Sarali 1</option>
                <option value="sarali2">Sarali 2</option>
                <option value="sarali3">Sarali 3</option>
                <option value="sarali4">Sarali 4</option>
                <option value="sarali5">Sarali 5</option>
                <option value="sarali6">Sarali 6</option>
                <option value="sarali7">Sarali 7</option>
                <option value="sarali8">Sarali 8</option>
                <option value="sarali9">Sarali 9</option>
                <option value="sarali10">Sarali 10</option>
                <option value="sarali11">Sarali 11</option>
                <option value="sarali12">Sarali 12</option>

            </select>

        </div>

        <div class="control">

            <label>⚡ Speed</label>

            <select id="speedSelect">

                <option value="speed1">1st Speed</option>
                <option value="speed2">2nd Speed</option>
                <option value="speed3">3rd Speed</option>

            </select>

        </div>

    </div>

    <div class="buttonPanel">

        <button id="startBtn">
            ▶ Start
        </button>

        <button id="pauseBtn">
            ⏸ Pause
        </button>

        <button id="restartBtn">
            🔄 Restart
        </button>

    </div>

    <div class="notes-box">

        <h2>🎼 Swara Practice</h2>

        <div id="notesDisplay"></div>

    </div>

    <div class="tala-box">

        <h2>🥁 Adi Tala</h2>

        <div id="talaContainer">

            <div class="talaBeat">👏<br>1</div>
            <div class="talaBeat">☝️<br>2</div>
            <div class="talaBeat">☝️<br>3</div>
            <div class="talaBeat">☝️<br>4</div>

            <div class="talaBeat">👏<br>5</div>
            <div class="talaBeat">👋<br>6</div>
            <div class="talaBeat">👏<br>7</div>
            <div class="talaBeat">👋<br>8</div>

        </div>

        <p id="talaText">
            Ready
        </p>

    </div>

    <div class="statusBox">

        <p id="status">
            🎵 Ready to Practice
        </p>

    </div>

    <audio id="audioPlayer" preload="auto"></audio>

</div>

<script src="script.js"></script>

</body>

</html>
